name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        env:
          PYTHONPATH: scripts
        # 10khr_cron_verify.py needs pyyaml for its D1 frontmatter check. The
        # module now degrades to SKIP without it, but installing it keeps D1 a
        # real assertion instead of a permanent no-op.
        run: |
          python3 -m pip install --quiet --upgrade pyyaml
          python3 -m unittest discover -s tests
      - name: Verify every script answers --help (D9)
        run: |
          set -e
          for f in scripts/*.py; do python3 "$f" --help > /dev/null; done
          for f in scripts/*.sh; do bash "$f" --help > /dev/null; done
